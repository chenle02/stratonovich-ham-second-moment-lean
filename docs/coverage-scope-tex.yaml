  tex: "$\\lambda$ is the square root of the supremum of the real Rayleigh quotient, and $I_\\Psi$, $v_\\Psi$ are given by their integral formulas (identification with $\\sqrt{-E_s}$ and $\\E W(\\Psi)^2$ is not formalized); E:spatial-static-score is proved both in the form that every number below the bound is exceeded by some admissible score and in its supremum form, with nothing supplied."
- label: L:symplectic-free
  ascii: "Lean proves both compact-baseline displays on an abstract nonzero Hilbert space with a supplied free group, isometric velocity reversal and weakly vanishing translations, for a Young evolution given only by convergence of its left Young sums; it proves W_t^T J_symp W_t = J_symp per frequency and the force skewness for the L^2 pairing. J_E and the preservation of omega on E are not formalized."
  tex: "Lean proves both compact-baseline displays on an abstract nonzero Hilbert space with a supplied free group, isometric velocity reversal and weakly vanishing translations, for a Young evolution given only by convergence of its left Young sums; it proves $W_t^{\\mathsf{T}}J_{\\rm symp}W_t=J_{\\rm symp}$ per frequency and the force skewness for the $L^2$ pairing. $J_E$ and the preservation of $\\omega$ on $E$ are not formalized."
- label: L:tube-closed-geometry
  ascii: "Lean proves, with the lemma's hypotheses and nothing supplied, that every T_r, r >= 0, is closed, the first identity {d_delta <= r} = T_r of E:tube-attained-radius, and that d_delta is lower semicontinuous; the Gaussian tail P(d_delta(X) > r) <= e^(-r^2/(2 delta)) and the almost sure finiteness of d_delta(X) are not formalized."
  tex: "Lean proves, with the lemma's hypotheses and nothing supplied, that every $\\mathcal{T}_r$, $r\\ge0$, is closed, the first identity $\\{d_\\delta\\le r\\}=\\mathcal{T}_r$ of E:tube-attained-radius, and that $d_\\delta$ is lower semicontinuous; the Gaussian tail $\\mathbb{P}(d_\\delta(X)>r)\\le e^{-r^2/(2\\delta)}$ and the almost sure finiteness of $d_\\delta(X)$ are not formalized."
- label: L:tube-rayleigh-tail
