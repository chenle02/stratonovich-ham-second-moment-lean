  tex: "Lean proves the bound with integrability and the finite head integral; the ``In particular'' application to the coarse-envelope bound of another proposition is not formalized."
- label: L:uniform-E-lift
  ascii: "Lean proves, for every covariance and cutoff profile with nothing supplied, that for every R >= 1 each L in V_(E,R) is B_E(M) with ||L|| = ||M||, the unique real potential V in H^(-1/2) supported in supp m_R with M u = V u on tests, and E:uniform-E-pairing with its symmetry for real states; the lift L_F and the Hermitian extension to complex states are not formalized."
  tex: "Lean proves, for every covariance and cutoff profile with nothing supplied, that for every $R\\ge1$ each $L$ in $\\mathcal{V}_{E,R}$ is $B_E(M)$ with $\\|L\\|=\\|M\\|$, the unique real potential $V$ in $H^{-1/2}$ supported in $\\operatorname{supp}m_R$ with $Mu=Vu$ on tests, and E:uniform-E-pairing with its symmetry for real states; the lift $L_F$ and the Hermitian extension to complex states are not formalized."
- label: L:uniform-mean-cutoff
  ascii: "Lean proves, for every real sigma and R >= 1, a bounded operator on H^sigma agreeing with multiplication by eta_R on real tests, of norm at most M_sigma (uniqueness not stated; tests are proved dense for sigma <= 1, covering the case sigma = 1/2 used), the embedding H^s -> H^t of norm at most one for t <= s, and E:uniform-spatial-mean for every T with the row at all states."
  tex: "Lean proves, for every real $\\sigma$ and $R\\ge1$, a bounded operator on $H^\\sigma$ agreeing with multiplication by $\\eta_R$ on real tests, of norm at most $M_\\sigma$ (uniqueness not stated; tests are proved dense for $\\sigma\\le1$, covering the case $\\sigma=1/2$ used), the embedding $H^s\\to H^t$ of norm at most one for $t\\le s$, and E:uniform-spatial-mean for every $T$ with the row at all states."
- label: L:uniform-mean-tensor
  ascii: "Lean proves the bound on finite tensors sum_j f_j (x) e_j with orthonormal e_j, for complete real Hilbert spaces H_0, G and 2 <= r < infinity (Gaussian route, Step 1 by Parseval and Minkowski), and the non-compactness sentence as the identity ||F_i - F_j|| = sqrt 2 ||A f||; the extension of A (x) I_G to the completed tensor product is not stated (Mathlib has no completed Hilbert tensor product)."
  tex: "Lean proves the bound on finite tensors $\\sum_jf_j\\otimes e_j$ with orthonormal $e_j$, for complete real Hilbert spaces $H_0$, $G$ and $2\\le r<\\infty$ (Gaussian route, Step 1 by Parseval and Minkowski), and the non-compactness sentence as the identity $\\|F_i-F_j\\|=\\sqrt2\\,\\|Af\\|$; the extension of $A\\otimes I_G$ to the completed tensor product is not stated (Mathlib has no completed Hilbert tensor product)."
- label: L:variational-control-dilation
  ascii: "Lean proves the bijection and the four identities with the section's hypotheses (H:homog, Gamma != 0, a = alpha0) and nothing supplied, for the variance in its integral form and the rate defined as the square root of the real Rayleigh supremum E:variational-real-rayleigh; their identification with E W(Psi)^2 (L:compact-raw-profile) and sqrt(-E_s) (P:variational-unmasked-rate) is not formalized."
  tex: "Lean proves the bijection and the four identities with the section's hypotheses (H:homog, $\\Gamma\\neq0$, $a=\\alpha_0$) and nothing supplied, for the variance in its integral form and the rate defined as the square root of the real Rayleigh supremum E:variational-real-rayleigh; their identification with $\\E W(\\Psi)^2$ (L:compact-raw-profile) and $\\sqrt{-E_s}$ (P:variational-unmasked-rate) is not formalized."
