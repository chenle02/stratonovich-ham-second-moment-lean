# LaTeX versions of coverage.yaml conclusion_scope sentences, for typesetting (e.g. the book appendix).
# One row for every coverage.yaml row that has a conclusion_scope, and no other rows; sorted by label.
# Same content as the ASCII sentence in coverage.yaml; math in $...$ with the manuscript macros;
# manuscript labels are bare (a generator turns them into references). coverage/1 has no field for this,
# so it lives here. Keyed by manuscript label; ascii repeats the coverage.yaml text so drift is detectable.
schema: coverage-scope-tex/1
rows:
- label: C:d1-first-calibration
  ascii: "Lean proves C_(1,*) = C_(2,*)/2^((4-alpha)/(3-alpha)) and 2C_(1,*) < C_(2,*) with nothing supplied, E:d1-first-calibration for random variables with the supplied mixed-moment expansion of P:mixed and the supplied first-moment series of the chaos expansion (solution not constructed), and the conditional rate clause for an abstract first moment; the P:Jensen comparison is commentary."
  tex: "Lean proves $C_{1,*}=C_{2,*}/2^{(4-\\alpha)/(3-\\alpha)}$ and $2C_{1,*}<C_{2,*}$ with nothing supplied, E:d1-first-calibration for random variables with the supplied mixed-moment expansion of P:mixed and the supplied first-moment series of the chaos expansion (solution not constructed), and the conditional rate clause for an abstract first moment; the P:Jensen comparison is commentary."
- label: C:intrinsic-spatial-bracket
  ascii: "Lean proves, with the section's hypotheses and nothing supplied, E:intrinsic-spatial-bracket and the comparison S_2^pos <= 2^m F_0(E_(1/2)^O) < 2^m F_a(E_(1/2)^O) for the variational value S_2^pos in place of C_2(Gamma,a) (identified by T:intrinsic-second-moment), with E_(1/2)^O over the class O itself; lambda is the square root of the real Rayleigh supremum."
  tex: "Lean proves, with the section's hypotheses and nothing supplied, E:intrinsic-spatial-bracket and the comparison $S_2^{\\mathrm{pos}}\\le2^mF_0(\\mathcal{E}_{1/2}^{\\mathcal{O}})<2^mF_a(\\mathcal{E}_{1/2}^{\\mathcal{O}})$ for the variational value $S_2^{\\mathrm{pos}}$ in place of $C_2(\\Gamma,a)$ (identified by T:intrinsic-second-moment), with $\\mathcal{E}_{1/2}^{\\mathcal{O}}$ over the class $\\mathcal{O}$ itself; $\\lambda$ is the square root of the real Rayleigh supremum."
- label: C:static-interaction
  ascii: "Lean proves E:static-block-series in full; E:static-interaction, with the identification of the interaction map with sum sigma^n Y_n and the order bounds derived from the primitive inputs below; and E:independent-static-blocks from the per-block bound on adapted phases; the Gaussian parity, the first-variance bounds and that per-block bound are supplied."
  tex: "Lean proves E:static-block-series in full; E:static-interaction, with the identification of the interaction map with $\\sum_n\\sigma^nY_n$ and the order bounds derived from the primitive inputs below; and E:independent-static-blocks from the per-block bound on adapted phases; the Gaussian parity, the first-variance bounds and that per-block bound are supplied."
- label: C:static-moment-constant-continuity
  ascii: "Every conclusion is proved for an abstract moment function with the supplied facts of the logconvexity proposition and the static minorant and law; the moments of the solution are not constructed, so their identification with that function is not formalized."
  tex: "Every conclusion is proved for an abstract moment function with the supplied facts of the logconvexity proposition and the static minorant and law; the moments of the solution are not constructed, so their identification with that function is not formalized."
- label: C:three-finite-images
  ascii: "Lean proves, with the corollary's hypotheses, that sum_i w_i (T_i)_# Gamma_i is a nonzero covariance with scaling 3 - alpha whose endpoints satisfy H:three-endpoints, and, from the supplied P:three-transfer, the coefficient, moment and asymptotic bounds for an abstract model of A_k(t), E u^2 and M_st; the asymptotic bound is for every spectral measure of the low endpoint."
  tex: "Lean proves, with the corollary's hypotheses, that $\\sum_iw_i(T_i)_\\#\\Gamma_i$ is a nonzero covariance with scaling $3-\\alpha$ whose endpoints satisfy H:three-endpoints, and, from the supplied P:three-transfer, the coefficient, moment and asymptotic bounds for an abstract model of $A_k(t)$, $\\E u^2$ and $\\mathcal{M}_{\\rm st}$; the asymptotic bound is for every spectral measure of the low endpoint."
- label: C:three-product-riesz
  ascii: "Lean proves, with the corollary's hypotheses, that the product and Riesz targets are nonzero covariances with scaling 3 - alpha whose endpoints satisfy H:three-endpoints, and, from the supplied P:three-transfer, the coefficient, moment and asymptotic bounds for an abstract model of A_k(t), E u^2 and M_st; the asymptotic bound is for every spectral measure of the low endpoint."
  tex: "Lean proves, with the corollary's hypotheses, that the product and Riesz targets are nonzero covariances with scaling $3-\\alpha$ whose endpoints satisfy H:three-endpoints, and, from the supplied P:three-transfer, the coefficient, moment and asymptotic bounds for an abstract model of $A_k(t)$, $\\E u^2$ and $\\mathcal{M}_{\\rm st}$; the asymptotic bound is for every spectral measure of the low endpoint."
- label: L:complex-phase
