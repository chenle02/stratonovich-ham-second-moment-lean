  tex: "E:spatial-smooth-score is proved, with nothing supplied, both in the form that every $y$ below the bound is exceeded by some $I_\\Psi-v_\\Psi/2$ and as a bound on the supremum, with $\\lambda$ the square root of the real Rayleigh supremum and $v_\\Psi$ given by its integral formula (identification with $\\sqrt{-E_s}$ and $\\E W(\\Psi)^2$ is not formalized). $R_0<\\infty$ is proved by L:spatial-fourier-bound."
