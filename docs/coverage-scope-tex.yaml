  tex: "The bounds and the $L^2$ limit are proved for any real $L^2$ family with absolutely convergent series and nonnegative mixed moments; for the terminal-chain terms these two facts are proved with the chain measures fixed only by their total masses, so the identification with the terms of the terminal Wick lemma is not formalized."
