# LaTeX versions of coverage.yaml conclusion_scope sentences, for typesetting (e.g. the book appendix).
# One row for every coverage.yaml row that has a conclusion_scope, and no other rows; sorted by label.
# Same content as the ASCII sentence in coverage.yaml; math in $...$ with the manuscript macros;
# manuscript labels are bare (a generator turns them into references). coverage/1 has no field for this,
# so it lives here. Keyed by manuscript label; ascii repeats the coverage.yaml text so drift is detectable.
schema: coverage-scope-tex/1
rows:
- label: C:intrinsic-spatial-bracket
  ascii: "Lean proves, with the section's hypotheses and nothing supplied, E:intrinsic-spatial-bracket and the comparison S_2^pos <= 2^m F_0(E_(1/2)^O) < 2^m F_a(E_(1/2)^O) for the variational value S_2^pos in place of C_2(Gamma,a) (identified by T:intrinsic-second-moment), with E_(1/2)^O over the class O modelled by joint representatives; lambda is the square root of the real Rayleigh supremum."
  tex: "Lean proves, with the section's hypotheses and nothing supplied, E:intrinsic-spatial-bracket and the comparison $S_2^{\\mathrm{pos}}\\le2^mF_0(\\mathcal{E}_{1/2}^{\\mathcal{O}})<2^mF_a(\\mathcal{E}_{1/2}^{\\mathcal{O}})$ for the variational value $S_2^{\\mathrm{pos}}$ in place of $C_2(\\Gamma,a)$ (identified by T:intrinsic-second-moment), with $\\mathcal{E}_{1/2}^{\\mathcal{O}}$ over the class $\\mathcal{O}$ modelled by joint representatives; $\\lambda$ is the square root of the real Rayleigh supremum."
- label: C:static-interaction
  ascii: "Lean proves E:static-block-series in full and checks the Hilbert-space and scalar steps of E:static-interaction and E:independent-static-blocks; the identification of the interaction map with sum sigma^n Y_n, the order bounds, the Gaussian parity, the first-variance bounds and the per-block bound are supplied."
  tex: "Lean proves E:static-block-series in full and checks the Hilbert-space and scalar steps of E:static-interaction and E:independent-static-blocks; the identification of the interaction map with $\\sum_n\\sigma^nY_n$, the order bounds, the Gaussian parity, the first-variance bounds and the per-block bound are supplied."
- label: C:static-moment-constant-continuity
  ascii: "Every conclusion is proved for an abstract moment function with the supplied facts of the logconvexity proposition and the static minorant and law; the moments of the solution are not constructed, so their identification with that function is not formalized."
  tex: "Every conclusion is proved for an abstract moment function with the supplied facts of the logconvexity proposition and the static minorant and law; the moments of the solution are not constructed, so their identification with that function is not formalized."
- label: L:complex-phase
  ascii: "Lean proves, with the lemma's hypotheses, the numerical-range and scalar steps on W(L) with nothing supplied, and, with the inputs below, the bounds 3, 6(1+lambda h), 6 (times e^(lambda h)) for C_h(L), F_h(L), H_h(L), the root comparisons 7/6, 6/5 and the bound 100 e^(2 lambda h) for the weighted block map; its identification with M_z(h) is not formalized."
  tex: "Lean proves, with the lemma's hypotheses, the numerical-range and scalar steps on $W(L)$ with nothing supplied, and, with the inputs below, the bounds $3$, $6(1+\\lambda h)$, $6$ (times $e^{\\lambda h}$) for $C_h(L)$, $F_h(L)$, $H_h(L)$, the root comparisons $7/6$, $6/5$ and the bound $100e^{2\\lambda h}$ for the weighted block map; its identification with $\\mathcal{M}_z(h)$ is not formalized."
- label: L:damped-homogeneous-norms
  ascii: "Proved with the lemma's hypotheses except part of the closing smoothing remark: spatial smoothing of the covariance appears only as membership of the Gaussian factor in the multiplier class (its spectral identification is not formalized). Green smoothing is identified with the smoothed norm in dimensions 1, 2 and 3. The N_0 mass identity under Green smoothing holds in every dimension."
  tex: "Proved with the lemma's hypotheses except part of the closing smoothing remark: spatial smoothing of the covariance appears only as membership of the Gaussian factor in the multiplier class (its spectral identification is not formalized). Green smoothing is identified with the smoothed norm in dimensions $1$, $2$ and $3$. The $N_0$ mass identity under Green smoothing holds in every dimension."
