- label: P:cameron-full-mean
  ascii: "Lean proves only the map U, with nothing supplied, for 2 < r < 2/a (H_I the kernel completion, M5), in two statements: for each temporal core a bounded U : H_I -> L^r(I; H_sp) with U(f (x) q)(s) = (K f)(s) q a.e. for time tests f and ||U|| <= ||C_t||; separately, such a U with ||U|| <= ||K_a||_(r/2)^(1/2). The compactness of T, its multiplier formula and E:cameron-compact-tail are not formalized."
  tex: "Lean proves only the map $U$, with nothing supplied, for $2<r<2/a$ ($H_I$ the kernel completion, M5), in two statements: for each temporal core a bounded $U:H_I\\to L^r(I;H_{\\mathrm{sp}})$ with $U(f\\otimes q)(s)=(Kf)(s)\\,q$ a.e. for time tests $f$ and $\\|U\\|\\le\\|C_t\\|$; separately, such a $U$ with $\\|U\\|\\le\\|K_a\\|_{r/2}^{1/2}$. The compactness of $T$, its multiplier formula and E:cameron-compact-tail are not formalized."
- label: P:cameron-spatial-map
  ascii: "Lean proves under H:homog, for a cutoff profile eta and every R > 0 with nothing supplied, the bounded map T_R : H_sp -> L(E) with T_R [q] = B_E(M), M the multiplier by m_R (Gamma * q), and E:cameron-spatial-row at c_1 = 0 at all states for alpha/4 < s < 1/2; with CutoffCompact, that T_R and its values are compact; the F columns (c_1 eta_R, B_F, K(F)) are not formalized."
  tex: "Lean proves under H:homog, for a cutoff profile $\\eta$ and every $R>0$ with nothing supplied, the bounded map $T_R:H_{\\mathrm{sp}}\\to\\mathcal{L}(E)$ with $T_R[q]=B_E(M)$, $M$ the multiplier by $m_R(\\Gamma*q)$, and E:cameron-spatial-row at $c_1=0$ at all states for $\\alpha/4<s<1/2$; with \\texttt{CutoffCompact}, that $T_R$ and its values are compact; the $F$ columns ($c_1\\eta_R$, $B_F$, $\\mathcal{K}(F)$) are not formalized."
- label: P:cameron-temporal-map
  ascii: "Lean proves, with nothing supplied, for 2 < r < 2/a: K is bounded, positive, strictly positive, injective and compact; a positive square root K^(1/2) is compact; iota : H_t -> L^2(I) is onto and isometric with iota [f] = K^(1/2) f; C_t = K^(1/2) iota is compact into L^r(I), C_t f = K f on tests. Not trace class and not Hilbert-Schmidt are stated as cell-sum identities (decision 7)."
  tex: "Lean proves, with nothing supplied, for $2<r<2/a$: $K$ is bounded, positive, strictly positive, injective and compact; a positive square root $K^{1/2}$ is compact; $\\iota:H_t\\to L^2(I)$ is onto and isometric with $\\iota[f]=K^{1/2}f$; $C_t=K^{1/2}\\iota$ is compact into $L^r(I)$, $C_tf=Kf$ on tests. Not trace class and not Hilbert--Schmidt are stated as cell-sum identities (decision 7)."
