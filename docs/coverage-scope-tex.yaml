  tex: "Lean constructs, with \\texttt{CutoffCompact} supplied, under H:homog, $\\Gamma\\neq0$, $2<r<2/\\alpha_0$, the wave-L15 \\texttt{UniformMeanRegulator}: $T_R$ ($R\\ge1$), $C_t$ compact into $L^r(I)$, $C_tf=Kf$ on tests, $U$ with its tensor formula and $\\|U\\|\\le\\|C_t\\|$, and $\\|T_RU\\|\\le M_0c_t$ uniformly in $R\\ge1$; its mean has compact values a.e. The projections $P_{\\mathrm{ret}}$, $Q_{J,K}$, $\\varepsilon_J\\to0$ and the tail bound are not formalized."
