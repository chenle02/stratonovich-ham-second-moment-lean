  tex: "Lean proves E:white-moment-bounds for the variational value $S_2^{\\mathrm{pos}}$ in place of $C_2(c,a)$ (identified by T:intrinsic-second-moment), for $c>0$ and $0<a<1$, with the value $\\mathcal{E}_{\\mathrm{sp}}=c^2/6$ of P:white-spatial-energy supplied (each bound uses one inequality of it), and that $M_a$, $K_0(a)$ and both bound formulas are positive; the time exponent sentence and the case $c=0$ are not formalized."
