  tex: "Lean proves the Cauchy coefficient estimate, the arithmetic at $\\lambda=n/h$ and the series bound of the proof, and from them both displays for abstract Banach-space quantities, with the circle bound (or the inputs of L:complex-phase and E:fock-sandwich), entireness, the coefficient identification, the norm comparisons, the cutoff removals and the free bound supplied; phases are not constructed."
- label: P:uniform-mean-regulator
