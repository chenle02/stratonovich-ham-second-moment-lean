  tex: "Lean proves E:positive-bochner-inclusion for every real Hilbert $G$ ($H_t\\otimes G$ the kernel completion of $L^2(I;G)$, M5), the inclusion of $\\mathcal{C}_{\\mathrm{pos}}$ in $H_I$ with $\\|\\Psi\\|^2=v_\\Psi$, the variance identity in integral form and the row and Schur bounds; the mean identity of E:positive-raw-mean and the canonical versions are not formalized."
