- label: L:fixed-split
  ascii: "Lean proves E:fixed-split-bound with C_split = 100^8 e^8 max(1, 12 delta^(-2)) for any delta > 0, on a finite Fock model of the cutoff Gaussian space with abstract spatial operators, for coefficients of an evolution that is not constructed; the segment bound, the Dyson cube identity, the invariance of the cross subspaces, entire coefficients and E:interval-column are supplied."
  tex: "Lean proves E:fixed-split-bound with $C_{\\rm split}=100^8e^8\\max\\{1,12\\delta^{-2}\\}$ for any $\\delta>0$, on a finite Fock model of the cutoff Gaussian space with abstract spatial operators, for coefficients of an evolution that is not constructed; the segment bound, the Dyson cube identity, the invariance of the cross subspaces, entire coefficients and E:interval-column are supplied."
- label: L:fock-form
  ascii: "Lean proves, with the lemma's hypotheses and nothing supplied, E:fock-sandwich, in coefficient form and as an operator-norm bound with A_0 >= 0 and B bounded self-adjoint on the cutoff Hilbert space, uniformly in eps, m and the band, for finitely many real modes, Hermite degree at most N in the m multiplied coordinates, on a Fourier-side model not identified with the physical-space operators."
  tex: "Lean proves, with the lemma's hypotheses and nothing supplied, E:fock-sandwich, in coefficient form and as an operator-norm bound with $A_0\\ge0$ and $B$ bounded self-adjoint on the cutoff Hilbert space, uniformly in $\\epsilon$, $m$ and the band, for finitely many real modes, Hermite degree at most $N$ in the $m$ multiplied coordinates, on a Fourier-side model not identified with the physical-space operators."
- label: L:interval-complex
  ascii: "Lean proves, with the lemma's hypotheses, the adjoint sandwich bound and the numerical-range and scalar steps on W(A_0 - V) with nothing supplied; with the inputs below, the bound 100 e^(2 Lambda h) for the weighted block map, not identified with the propagator in X_Lambda; and E:interval-metric for given finite jump data and, for the scalar conversion factors, along any monotone time partition."
  tex: "Lean proves, with the lemma's hypotheses, the adjoint sandwich bound and the numerical-range and scalar steps on $W(A_0-V)$ with nothing supplied; with the inputs below, the bound $100e^{2\\Lambda h}$ for the weighted block map, not identified with the propagator in $X_\\Lambda$; and E:interval-metric for given finite jump data and, for the scalar conversion factors, along any monotone time partition."
- label: L:interval-contractions
  ascii: "Lean proves, with the lemma's hypotheses and nothing supplied, E:interval-column, its band-compressed form, the phase-insertion bound sqrt(R_alpha) rho^((alpha-2)/2), the sandwich bound R_alpha rho^(alpha-4) with self-adjointness and E:interval-fock, for finitely many real modes, on a Fourier-side model not identified with the physical-space operators, without tensoring by another Hilbert factor."
  tex: "Lean proves, with the lemma's hypotheses and nothing supplied, E:interval-column, its band-compressed form, the phase-insertion bound $\\sqrt{R_\\alpha}\\,\\rho^{(\\alpha-2)/2}$, the sandwich bound $R_\\alpha\\rho^{\\alpha-4}$ with self-adjointness and E:interval-fock, for finitely many real modes, on a Fourier-side model not identified with the physical-space operators, without tensoring by another Hilbert factor."
- label: L:occupation-raw-square
  ascii: "Lean proves, with the section's hypotheses and nothing supplied, Q: H^1 -> H_sp with <Q(f),Q(h)> = B_Gamma(f^2,h^2), continuous on H^1 (M6), and for fields of O modelled by joint representatives rho_g in H_I (M5) both identities of E:occupation-raw-identities and <Psi,rho_g> <= sqrt(v_Psi A(g)); these are not restated on the class O itself."
  tex: "Lean proves, with the section's hypotheses and nothing supplied, $Q:H^1\\to H_{\\mathrm{sp}}$ with $\\langle Q(f),Q(h)\\rangle=B_\\Gamma(f^2,h^2)$, continuous on $H^1$ (M6), and for fields of $\\mathcal{O}$ modelled by joint representatives $\\rho_g\\in H_I$ (M5) both identities of E:occupation-raw-identities and $\\langle\\Psi,\\rho_g\\rangle\\le\\sqrt{v_\\Psi A(g)}$; these are not restated on the class $\\mathcal{O}$ itself."
- label: L:occupation-rayleigh-selection
  ascii: "Lean proves E:occupation-rayleigh-selection with the section's hypotheses and nothing supplied, with g_eps in the class O itself (strongly H^1-measurable fields, read as a.e.-strongly measurable); lambda is the square root of the real Rayleigh supremum and v_Psi the integral-form cost, and their identification with sqrt(-E_s) and E W(Psi)^2 is not formalized."
  tex: "Lean proves E:occupation-rayleigh-selection with the section's hypotheses and nothing supplied, with $g_\\varepsilon$ in the class $\\mathcal{O}$ itself (strongly $H^1$-measurable fields, read as a.e.-strongly measurable); $\\lambda$ is the square root of the real Rayleigh supremum and $v_\\Psi$ the integral-form cost, and their identification with $\\sqrt{-E_s}$ and $\\mathbb{E}W(\\Psi)^2$ is not formalized."
- label: L:positive-physical-gram
  ascii: "Lean proves, with the section's hypotheses and nothing supplied, that k_i^R and k_i^infty lie in H_I (M5), that both Grams factor into the temporal pairing and B_Gamma, and that both are positive semidefinite; the label row E:positive-label-row (T_R, v_L not constructed) and the entrywise order (left out by wave L14 decision 5) are not formalized."
  tex: "Lean proves, with the section's hypotheses and nothing supplied, that $k_i^R$ and $k_i^\\infty$ lie in $H_I$ (M5), that both Grams factor into the temporal pairing and $B_\\Gamma$, and that both are positive semidefinite; the label row E:positive-label-row ($\\mathcal{T}_R$, $v_L$ not constructed) and the entrywise order (left out by wave L14 decision 5) are not formalized."
