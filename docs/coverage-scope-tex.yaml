- label: T:intrinsic-occupation-ceiling
  ascii: "Lean proves, with the section's hypotheses and nothing supplied, for every c > 0: c I_Psi - v_Psi/2 <= U_c for every nonnegative smooth control, S_c^pos <= U_c with the exact C_occ, and U_c = c^m (2 zeta)^(alpha/(2k)) F_0(E_zeta^O) for every zeta > 0, with C_occ and E_zeta^O over the class O modelled by joint representatives; C_2(Gamma,a) <= U_2 is not formalized."
  tex: "Lean proves, with the section's hypotheses and nothing supplied, for every $\\mathfrak{c}>0$: $\\mathfrak{c}I_\\Psi-v_\\Psi/2\\le U_{\\mathfrak{c}}$ for every nonnegative smooth control, $S_{\\mathfrak{c}}^{\\mathrm{pos}}\\le U_{\\mathfrak{c}}$ with the exact $C_{\\rm occ}$, and $U_{\\mathfrak{c}}=\\mathfrak{c}^m(2\\zeta)^{\\alpha/(2k)}F_0(\\mathcal{E}_\\zeta^{\\mathcal{O}})$ for every $\\zeta>0$, with $C_{\\rm occ}$ and $\\mathcal{E}_\\zeta^{\\mathcal{O}}$ over the class $\\mathcal{O}$ modelled by joint representatives; $C_2(\\Gamma,a)\\le U_2$ is not formalized."
