  tex: "Lean checks only the facts about the wave Green measures quoted in the proof from the source (their mass and the scaling $G_h(hA)=hG_1(A)$ for measurable $A$; in $d=3$ the surface measure of the unit sphere is taken as given, not derived), not the result itself."
- label: L:interval-complex
