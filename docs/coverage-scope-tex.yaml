- label: P:variational-unmasked-rate
  ascii: "Lean proves, with the section's hypotheses and nothing supplied, the statements about the Rayleigh supremum E:variational-real-rayleigh: for lambda defined as its square root, a uniform positive floor, the Lipschitz bounds and I_Psi positive and finite; the operator statements (H_s self-adjoint, form domain H^1, spectral bottom E_s, lambda = sqrt(-E_s)) are not formalized."
  tex: "Lean proves, with the section's hypotheses and nothing supplied, the statements about the Rayleigh supremum E:variational-real-rayleigh: for $\\lambda$ defined as its square root, a uniform positive floor, the Lipschitz bounds and $I_\\Psi$ positive and finite; the operator statements ($H_s$ self-adjoint, form domain $H^1$, spectral bottom $E_s$, $\\lambda=\\sqrt{-E_s}$) are not formalized."
- label: P:wave-two-variances
  ascii: "Lean bounds an abstract variance tied to E|l_R|^2 only through the named input E:variance-normalized-covariance; l_R, the spaces E_r and J are not constructed. The spectral core (the sums of the nu_R-integrals of E:variance-normalized-covariance, both directions, the h^(2 beta) form) is proved in full with no input."
  tex: "Lean bounds an abstract variance tied to $\\E|\\ell_R|^2$ only through the named input E:variance-normalized-covariance; $\\ell_R$, the spaces $E_r$ and $J$ are not constructed. The spectral core (the sums of the $\\nu_R$-integrals of E:variance-normalized-covariance, both directions, the $h^{2\\beta}$ form) is proved in full with no input."
