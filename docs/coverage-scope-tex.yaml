  tex: "Lean proves E:finite-word-cutoff for one Gaussian coordinate per color ($m_i=1$), in normalized Hermite coefficients with values in a complex inner product space, for a single finite word whose color counts are at most the cutoffs; colors with several coordinates and the sentence on finite sums and Bochner integrals of words are not formalized."
- label: L:fock-form
