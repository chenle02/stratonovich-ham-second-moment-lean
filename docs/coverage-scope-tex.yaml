  tex: "Lean proves both compact-baseline displays on an abstract nonzero Hilbert space with a supplied free group, isometric velocity reversal and weakly vanishing translations, for a Young evolution given only by convergence of its left Young sums; it proves $W_t^{\\mathsf{T}}J_{\\rm symp}W_t=J_{\\rm symp}$ per frequency and the force skewness for the $L^2$ pairing. $J_E$ and the preservation of $\\omega$ on $E$ are not formalized."
- label: L:terminal-wick
  ascii: "Proved for real r only, with the chain measures replaced by arbitrary finite measures on n-tuples of points of [0,T] x R^d of total mass T^(2n)/(2n)! (g_n^{T,x} not constructed); the comparison is stated per mixed moment E[Y_m Y_n], not for partial sums; the Wick formula adds a hypothesis the lemma lacks: joint measurability of the covariance."
  tex: "Proved for real $r$ only, with the chain measures replaced by arbitrary finite measures on $n$-tuples of points of $[0,T]\\times\\R^d$ of total mass $T^{2n}/(2n)!$ ($\\mathsf{g}_n^{T,x}$ not constructed); the comparison is stated per mixed moment $\\E[Y_mY_n]$, not for partial sums; the Wick formula adds a hypothesis the lemma lacks: joint measurability of the covariance."
