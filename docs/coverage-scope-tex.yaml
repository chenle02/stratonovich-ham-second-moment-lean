  tex: "Lean proves the bijection and the four identities with the section's hypotheses (H:homog, $\\Gamma\\neq0$, $a=\\alpha_0$) and nothing supplied, for the variance in its integral form and the rate defined as the square root of the real Rayleigh supremum E:variational-real-rayleigh; their identification with $\\E W(\\Psi)^2$ (L:compact-raw-profile) and $\\sqrt{-E_s}$ (P:variational-unmasked-rate) is not formalized."
