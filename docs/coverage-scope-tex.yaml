  tex: "Lean proves E:occupation-rayleigh-selection with the section's hypotheses and nothing supplied, with $g_\\varepsilon$ in the class $\\mathcal{O}$ itself (strongly $H^1$-measurable fields, read as a.e.-strongly measurable); $\\lambda$ is the square root of the real Rayleigh supremum and $v_\\Psi$ the integral-form cost, and their identification with $\\sqrt{-E_s}$ and $\\mathbb{E}W(\\Psi)^2$ is not formalized."
- label: L:positive-physical-gram
