  tex: "Lean proves, with the lemma's hypotheses, the adjoint sandwich bound and the numerical-range and scalar steps on $W(A_0-V)$ with nothing supplied; with the inputs below, the bound $100e^{2\\Lambda h}$ for the weighted block map, not identified with the propagator in $X_\\Lambda$; and E:interval-metric for given finite jump data, without the telescoping along the time partition."
