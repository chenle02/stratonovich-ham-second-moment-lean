  tex: "Lean proves E:fock-sandwich and the symmetry of the sandwiched truncated operator, uniformly in $\\epsilon$, $m$ and the band, on Gaussian polynomials of degree at most $N$ in the $m$ multiplied coordinates (in normalized Hermite coefficients and in Gaussian $L^2$), from the supplied spatial column bound $\\sum_iH_i^2\\le R_\\alpha\\rho^{\\alpha-4}$; coordinates $g_i$ with $i>m$ are not modelled."
- label: L:higher-riesz
