  tex: "Lean proves, from E:interval-column as a supplied input, its band-compressed form, the bound $\\sqrt{R_\\alpha}\\,\\rho^{(\\alpha-2)/2}$ for the phase insertion on a color in its vacuum, the sandwich bound $R_\\alpha\\rho^{\\alpha-4}$ with self-adjointness, and E:interval-fock, for finitely many modes and any inner product space as the other factor; E:interval-column itself is not proved."
- label: L:occupation-rayleigh-selection
